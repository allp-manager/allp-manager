<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title description">
  <title id="title">Illustrative Allp live maintenance dashboard</title>
  <desc id="description">A dark terminal-style panel showing native package-manager output, a success card, a warning card, and a live progress footer for Allp update.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1120" height="660" fill="#e8edf5"/>
  <rect x="34" y="32" width="1052" height="596" rx="18" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="34" y="32" width="1052" height="44" rx="18" fill="#1f2937"/>
  <rect x="34" y="58" width="1052" height="18" fill="#1f2937"/>
  <circle cx="65" cy="54" r="7" fill="#fb7185"/>
  <circle cx="89" cy="54" r="7" fill="#fbbf24"/>
  <circle cx="113" cy="54" r="7" fill="#4ade80"/>
  <text x="550" y="59" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">allp update · interactive terminal</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="66" y="111" fill="#94a3b8">Phase 5: Execution</text>

    <rect x="64" y="130" width="992" height="110" rx="8" fill="#0f2430" stroke="#22d3ee" stroke-opacity="0.75"/>
    <text x="88" y="164" fill="#67e8f9" font-weight="700">ALLP · UPDATE · LIVE</text>
    <text x="88" y="198" fill="#cbd5e1">Native output remains visible. The footer tracks the current work.</text>

    <text x="72" y="276" fill="#94a3b8">› Hit:1 http://archive.ubuntu.com/ubuntu stable InRelease</text>
    <text x="72" y="304" fill="#94a3b8">› Reading package lists...</text>
    <text x="72" y="332" fill="#fbbf24">! W: Some index files failed to download. Old indexes were used instead.</text>

    <rect x="64" y="354" width="992" height="102" rx="8" fill="#10291d" stroke="#4ade80" stroke-opacity="0.85"/>
    <text x="88" y="388" fill="#86efac" font-weight="700">COMPLETED · 1/2 · APT</text>
    <text x="88" y="422" fill="#d1fae5">Result: Completed · Refresh package metadata · Elapsed: 39s</text>

    <rect x="64" y="476" width="992" height="78" rx="8" fill="#2b2110" stroke="#fbbf24" stroke-opacity="0.82"/>
    <text x="88" y="510" fill="#fde68a" font-weight="700">RUNNING · 2/2 · HOMEBREW</text>
    <text x="88" y="536" fill="#fef3c7">Action: Refresh Homebrew formula and cask metadata</text>
  </g>

  <rect x="34" y="574" width="1052" height="54" rx="0" fill="#0f172a"/>
  <rect x="34" y="574" width="1052" height="54" rx="0" fill="none" stroke="#334155"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="65" y="607" fill="#67e8f9">[█████████░░░░░░░░░] 2/2 · Homebrew · Refresh metadata · 4s</text>
    <text x="1038" y="607" text-anchor="end" fill="#64748b">illustrative output</text>
  </g>
</svg>
