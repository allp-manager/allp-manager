name: Publish signed APT archive

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Stable tag (vX.Y.Z); empty selects newest Stable
        required: false
        type: string
  schedule:
    # Keep signed metadata fresh, including when there is no new Stable release.
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: apt-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test signing and isolated APT resolution
        run: python3 tools/test-apt-repository.py
      - name: Package checksum-verified published Stable assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [[ -n "$REQUESTED_TAG" ]]; then args+=(--tag "$REQUESTED_TAG"); fi
          python3 tools/prepare-apt-release.py "${args[@]}" --existing public --output incoming
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-stable-packages
          path: incoming/
          retention-days: 3
          if-no-files-found: error

  sign:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-stable-packages
          path: incoming
      - name: Sign archive without executing package binaries
        env:
          GNUPGHOME: ${{ runner.temp }}/allp-apt-gnupg
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$GNUPGHOME"
          trap 'gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          shopt -s nullglob
          packages=(incoming/*.deb)
          python3 tools/build-apt-repository.py --previous public --packages "${packages[@]}" \
            --output next-public --base-url https://allp-manager.github.io/apt \
            --key "$APT_FINGERPRINT" --gnupghome "$GNUPGHOME"
          cp incoming/provenance.json next-public/provenance.json
          chmod 0644 next-public/provenance.json
          rm -rf public
          mv next-public public
      - name: Record public metadata and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public
          git commit -m 'Refresh signed Allp APT archive'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public APT archive
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
