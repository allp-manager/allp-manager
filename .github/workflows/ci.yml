name: CI

on:
  push:
    branches: [main, "prerelease-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee quality-tests.log
      - run: bash scripts/check-architecture.sh
      - run: make installer-test
      - run: make distribution-test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-test-results
          path: quality-tests.log
          if-no-files-found: ignore
          retention-days: 14

  native-platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-latest
          - name: Ubuntu aarch64
            os: ubuntu-24.04-arm
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS aarch64
            os: macos-15
          - name: Windows x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
      - name: Run native tests and record output
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee native-tests.log
      - name: Verify native release installer
        id: installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          make installer-test 2>&1 | tee native-installer.log
      - name: Explain platform-specific integration coverage
        if: runner.os != 'Linux'
        shell: bash
        run: echo 'Linux fake-PATH and PTY integration tests are skipped on this host; portable unit and compilation tests ran above.'
      - name: Report native results
        if: always()
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.name }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
        run: |
          printf '### %s\n\nCargo tests completed with outcome %s.\n' "$PLATFORM_NAME" "$TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$INSTALLER_OUTCOME" ]]; then
            printf 'Installer tests completed with outcome %s.\n' "$INSTALLER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$TEST_OUTCOME" == failure && -f native-tests.log ]]; then
            awk '/^test .* \.\.\. FAILED$/ {print "- `" $2 "`"}' native-tests.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results-${{ matrix.os }}
          path: |
            native-tests.log
            native-installer.log
          if-no-files-found: ignore
          retention-days: 14

  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets

  linux-cross-targets:
    name: Linux cross-check · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --all-targets --target "${{ matrix.target }}"

  linux-family-contracts:
    name: Linux family provider contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Debian, Red Hat, Arch, SUSE, and Alpine bootstrap mappings
        run: cargo test bootstrap::providers --lib
