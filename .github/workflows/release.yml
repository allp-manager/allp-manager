name: Release

on:
  push:
    branches:
      - "release-candidate-*"
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  ALLP_BUILD_REVISION: "0"
  ALLP_GIT_SHA: ${{ github.sha }}
  ALLP_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
  ALLP_BUILD_CHANNEL: stable
  ALLP_BUILD_OFFICIAL: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      notes: ${{ steps.version.outputs.notes }}
      channel: ${{ steps.version.outputs.channel }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          version="$cargo_version"
          tag="v${version}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
            test "$commit" = "$(git rev-list -n 1 "$tag")"
          else
            test "$GITHUB_REF_NAME" = "release-candidate-$version"
          fi
          title="release/RELEASE_TITLE_v${version}.txt"
          notes="release/RELEASE_NOTES_v${version}.md"
          test -s "$title"
          test -s "$notes"
          test -s release/MINIMUM_UPDATER_VERSION.txt
          channel=stable
          channel_file="release/RELEASE_CHANNEL_v${version}.txt"
          if [[ -f "$channel_file" ]]; then
            channel="$(tr -d '[:space:]' < "$channel_file")"
          fi
          [[ "$channel" == stable || "$channel" == prerelease ]]
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'title=%s\n' "$title" >>"$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >>"$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$channel" >>"$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
          printf 'ALLP_BUILD_CHANNEL=%s\n' "$channel" >>"$GITHUB_ENV"
          printf 'ALLP_GIT_SHA=%s\n' "$commit" >>"$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo fmt --all -- --check
      - name: Require test runs for the tagged Stable source
        if: github.ref_type == 'tag' && steps.version.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_COMMIT&per_page=100" >test-runs.json
            status=0
            python3 scripts/validate-release-runs.py --repo "$GITHUB_REPOSITORY" \
              --sha "$RELEASE_COMMIT" --runs test-runs.json --output release-validation.json || status=$?
            if [[ "$status" == 0 ]]; then break; fi
            if [[ "$status" != 75 || "$attempt" == 60 ]]; then exit "$status"; fi
            sleep 20
          done
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' && steps.version.outputs.channel == 'stable'
        with:
          name: stable-validation-${{ steps.version.outputs.tag }}
          path: release-validation.json
          if-no-files-found: error
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib --bins --test catalog --test exit_codes --test modularity
      - run: bash scripts/check-architecture.sh
      - run: sh -n scripts/install-release.sh
      - run: bash scripts/test-install-release.sh
      - run: cargo build --locked --release

  binary:
    needs: validate
    env:
      ALLP_BUILD_CHANNEL: ${{ needs.validate.outputs.channel }}
      ALLP_GIT_SHA: ${{ needs.validate.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: allp
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: allp
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: allp
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: allp
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: allp.exe
          - os: ubuntu-24.04
            target: aarch64-linux-android
            archive: tar.gz
            binary: allp
            android: true
          - os: ubuntu-24.04
            target: x86_64-linux-android
            archive: tar.gz
            binary: allp
            android: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Configure Android NDK linker
        if: matrix.android
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?Missing Android NDK}}"
          linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/${RELEASE_TARGET}24-clang"
          test -x "$linker"
          target_key="$(tr '[:lower:]-' '[:upper:]_' <<<"$RELEASE_TARGET")"
          printf 'CARGO_TARGET_%s_LINKER=%s\n' "$target_key" "$linker" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_%s_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384\n' "$target_key" >> "$GITHUB_ENV"
      - run: cargo test --locked --lib --bins --test catalog --test exit_codes --test modularity
        if: matrix.android != true
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify the compiled release identity
        if: matrix.android != true
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          binary="target/$RELEASE_TARGET/release/$RELEASE_BINARY"
          "$binary" --version | tr -d '\r' | grep -Fx "allp $RELEASE_VERSION"
          identity="$("$binary" --version --verbose | tr -d '\r')"
          test "$(awk '/^Channel:$/ { getline; print $1 }' <<<"$identity")" = "$ALLP_BUILD_CHANNEL"
          test "$(awk '/^Commit:$/ { getline; print $1 }' <<<"$identity")" = "$ALLP_GIT_SHA"
      - name: Verify Android executable links against Android libc
        if: matrix.android
        shell: bash
        run: |
          readelf --wide --program-headers "target/${{ matrix.target }}/release/allp" |
            grep -F '[Requesting program interpreter: /system/bin/linker64]'
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          name="allp-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/allp
          tar -C package -czf "dist/$name" allp
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name" >"$name.sha256")
          else
            hash="$(shasum -a 256 "dist/$name" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$name" >"dist/$name.sha256"
          fi
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $name = "allp-v$version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist, package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "package/allp.exe"
          Compress-Archive -Path "package/allp.exe" -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -NoNewline "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: [validate, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Build exact-tag source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.validate.outputs.commit }}'
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            # The candidate checkout needs a local archive ref. It is never pushed.
            git tag --force '${{ needs.validate.outputs.tag }}' HEAD
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 '${{ needs.validate.outputs.tag }}')"
          scripts/release-finalize.sh --archive
          scripts/release-finalize.sh --checksum
          install -m 0755 scripts/install-release.sh dist/install-allp.sh
          (cd dist && sha256sum install-allp.sh >install-allp.sh.sha256)
      - name: Verify checksums and generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
          python3 scripts/generate-release-manifest.py \
            --version "${{ needs.validate.outputs.version }}" \
            --channel "${{ needs.validate.outputs.channel }}" \
            --minimum-updater-version "$(tr -d '[:space:]' < release/MINIMUM_UPDATER_VERSION.txt)" \
            --dist dist \
            --output dist/allp-release-manifest.json
          python3 scripts/generate-release-manifest.py \
            --verify dist/allp-release-manifest.json \
            --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ needs.validate.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ needs.validate.outputs.tag }}
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.validate.outputs.channel == 'stable'
        with:
          name: stable-validation-${{ needs.validate.outputs.tag }}
          path: validation
      - name: Include external validation status in release notes
        if: needs.validate.outputs.channel == 'stable'
        env:
          NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads(Path('validation/release-validation.json').read_text())
          if proof['status'] == 'passed_with_store_outage':
              url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{proof['canary_run']}"
              with Path(os.environ['NOTES']).open('a') as notes:
                  notes.write('\n## External service validation\n\n' + proof['store_outage']
                              + f' The [online canary]({url}) remains failed for this external error. '
                              + 'Exact-source CI, WinGet, Termux and the other native backend checks passed.\n')
          PY
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          title="$(cat '${{ needs.validate.outputs.title }}')"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%p\n' | sort)
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--prerelease=false --latest=true)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = true
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" \
              --verify-tag \
              "${release_flags[@]}" \
              --title "$title" \
              --notes-file "${{ needs.validate.outputs.notes }}"
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              "${release_flags[@]}" \
              --title "$title" \
              --notes-file "${{ needs.validate.outputs.notes }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
