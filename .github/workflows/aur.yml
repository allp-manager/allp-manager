name: AUR package

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the tested package to AUR
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-package
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'allp-manager/allp-manager' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      build: ${{ steps.metadata.outputs.build }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: metadata
        name: Resolve a published Stable release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint=latest
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$INPUT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            endpoint="tags/$INPUT_TAG"
          fi
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/allp-manager/allp-manager/releases/$endpoint" >release.json
          tag="$(jq -er '.tag_name' release.json)"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit="$(git rev-parse "$tag^{commit}")"
          curl -fsSL --retry 3 'https://aur.archlinux.org/rpc/v5/info?arg%5B%5D=allp-manager' >aur.json
          python3 scripts/resolve-aur-release.py --event-name "$GITHUB_EVENT_NAME" \
            --event "$GITHUB_EVENT_PATH" --release release.json --aur aur.json \
            --commit "$commit" --ref "$GITHUB_REF" --tag "$INPUT_TAG" \
            --publish "${INPUT_PUBLISH:-false}" --output selection.json
          jq -r 'to_entries[] | select(.key != "reason") | "\(.key)=\(.value)"' selection.json >>"$GITHUB_OUTPUT"
          jq -r '.reason' selection.json >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aur-selection
          path: selection.json
          if-no-files-found: error

  build:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed cargo git jq python
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate and test the AUR package
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable tag in vX.Y.Z format." >&2
            exit 1
          fi
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/allp-manager/allp-manager/releases/tags/$TAG" |
            jq -e --arg tag "$TAG" '.tag_name == $tag and (.draft == false) and (.prerelease == false)' >/dev/null

          version="${TAG#v}"
          build_dir="$(mktemp -d)"
          archive="$build_dir/allp-manager-$version.tar.gz"
          curl -fsSL --retry 3 "https://github.com/allp-manager/allp-manager/archive/refs/tags/$TAG.tar.gz" \
            -o "$archive"
          checksum="$(sha256sum "$archive" | cut -d' ' -f1)"
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]]
          python - "$archive" "$version" <<'PY'
          import sys, tarfile, tomllib
          with tarfile.open(sys.argv[1]) as archive:
              manifest = archive.extractfile(f'allp-manager-{sys.argv[2]}/Cargo.toml')
              assert manifest is not None
              assert tomllib.loads(manifest.read().decode())['package']['version'] == sys.argv[2]
          PY
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$checksum/" \
            -e "s/@COMMIT@/$RELEASE_COMMIT/" \
            packaging/aur/PKGBUILD > "$build_dir/PKGBUILD"

          useradd --create-home builder
          chown -R builder:builder "$build_dir"
          cd "$build_dir"
          runuser -u builder -- makepkg --noconfirm
          package_file="$(runuser -u builder -- makepkg --packagelist)"
          pacman -U --noconfirm -- "$package_file"
          pacman -Q allp-manager
          test "$(/usr/bin/allp --version)" = "allp $version"
          /usr/bin/allp --version --verbose | grep -F "$RELEASE_COMMIT"
          runuser -u builder -- /usr/bin/allp upgrade --dry-run --no-interactive --no-color |
            grep -F -e ' -Syu'
          mkdir -p "$GITHUB_WORKSPACE/aur-package"
          cp PKGBUILD "$GITHUB_WORKSPACE/aur-package/"
          runuser -u builder -- makepkg --printsrcinfo > "$GITHUB_WORKSPACE/aur-package/.SRCINFO"
      - uses: actions/upload-artifact@v4
        with:
          name: aur-package
          path: aur-package/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: needs.release.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.repository == 'allp-manager/allp-manager'
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aur-package
          path: aur-package
      - name: Push package metadata to AUR
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${AUR_SSH_PRIVATE_KEY:?Configure the AUR_SSH_PRIVATE_KEY Actions secret first.}"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          unset AUR_SSH_PRIVATE_KEY
          ssh-keyscan -T 10 -t ed25519 aur.archlinux.org > "$ssh_dir/known_hosts" 2>/dev/null
          # Published at https://aur.archlinux.org/
          test "$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}')" = \
            'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $ssh_dir/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          git clone ssh://aur@aur.archlinux.org/allp-manager.git aur-repo
          cp aur-package/PKGBUILD aur-package/.SRCINFO aur-repo/
          cd aur-repo
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "AUR already contains this package."
            exit 0
          fi
          current="$(git show HEAD:.SRCINFO | awk '$1 == "pkgver" { print $3; exit }')"
          version="${TAG#v}"
          if [[ -z "$current" || "$current" == "$version" || "$(printf '%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "AUR package version $current must be older than $version." >&2
            exit 1
          fi
          git add -- PKGBUILD .SRCINFO
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update allp-manager to $version"
          git push origin HEAD
