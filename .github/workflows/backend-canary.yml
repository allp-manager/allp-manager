name: Weekly backend canary

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-search:
    name: ${{ matrix.backend }} on ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            image: ubuntu:24.04
            backend: apt
            query: bash
            setup: apt-get update && apt-get install -y ca-certificates curl build-essential
          - name: Fedora
            image: fedora:latest
            backend: dnf
            query: bash
            setup: dnf install -y ca-certificates curl gcc make
          - name: Arch Linux
            image: archlinux:latest
            backend: pacman
            query: bash
            setup: pacman -Syu --noconfirm ca-certificates curl base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        shell: bash
        run: ${{ matrix.setup }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build canary binary
        run: cargo build --locked
      - name: Exercise native search parser
        run: target/debug/allp search "${{ matrix.query }}" --from "${{ matrix.backend }}" --json >canary.json
      - name: Require complete search output
        shell: bash
        run: |
          grep -q '"schema_version": 2' canary.json
          grep -q '"complete": true' canary.json
          grep -q '"package_id":' canary.json
      - name: Check Arch's default upgrade plan
        if: matrix.backend == 'pacman'
        shell: bash
        run: |
          target/debug/allp upgrade --dry-run --json >upgrade-plan.json
          grep -q '"complete": true' upgrade-plan.json
          grep -q '"backend_id": "pacman"' upgrade-plan.json
          grep -q 'pacman -Syu' upgrade-plan.json
      - name: Report search failure
        if: failure()
        shell: bash
        run: |
          if [[ -s canary.json ]]; then cat canary.json; fi
          if [[ -s upgrade-plan.json ]]; then cat upgrade-plan.json; fi
          if [[ '${{ matrix.backend }}' == dnf ]]; then dnf -q search '${{ matrix.query }}' || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-${{ matrix.backend }}
          path: |
            canary.json
            upgrade-plan.json
          if-no-files-found: ignore

  flatpak-search:
    name: Flatpak on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Flathub for the runner user
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo apt-get install -y flatpak
          timeout 60s flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: cargo build --locked
      - name: Exercise user-scoped Flatpak search
        shell: bash
        run: |
          timeout 90s target/debug/allp search firefox --from flatpak --json | tee canary.json
          grep -Fq '"schema_version": 2' canary.json
          grep -Fq '"complete": true' canary.json
          grep -Fq '"package_id": "org.mozilla.firefox"' canary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-flatpak
          path: canary.json
          if-no-files-found: ignore

  snap-search:
    name: Snap on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start snapd
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo systemctl enable --now snapd.socket
          timeout 60s snap wait system seed.loaded
      - run: cargo build --locked
      - name: Check native Snap Store availability
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s snap find hello-world | tee snap-native-search.log
          grep -Eq '^hello-world[[:space:]]' snap-native-search.log
      - name: Exercise Snap discovery
        run: target/debug/allp search hello-world --from snap --json >canary.json
      - name: Require complete search output
        shell: bash
        run: |
          grep -q '"schema_version": 2' canary.json
          grep -q '"complete": true' canary.json
          grep -q '"package_id":' canary.json
      - name: Exercise real Snap install, refresh and removal
        shell: bash
        run: |
          set -euo pipefail
          if snap list hello-world >/dev/null 2>&1; then
            echo 'Refusing to replace a pre-existing smoke-test application.' >&2
            exit 1
          fi
          trap 'sudo snap remove --purge hello-world >snap-cleanup.log 2>&1 || true' EXIT
          timeout 180s target/debug/allp install hello-world --from snap --yes --no-interactive --no-color | tee snap-install.log
          snap list hello-world | tee snap-installed.log
          snap run hello-world | tee snap-run.log
          grep -Fq 'Hello World!' snap-run.log
          timeout 180s target/debug/allp upgrade --from snap --yes --no-interactive --no-tui --no-color | tee snap-upgrade.log
          timeout 180s target/debug/allp remove hello-world --from snap --yes --no-interactive --no-color | tee snap-remove.log
          if snap list hello-world >/dev/null 2>&1; then
            echo 'Allp reported removal success but hello-world is still installed.' >&2
            exit 1
          fi
      - name: Capture native Snap diagnostics on failure
        if: failure()
        shell: bash
        run: |
          {
            snap version
            timeout 30s snap debug connectivity
            timeout 60s snap find hello-world
            snap changes
            sudo journalctl -u snapd --no-pager -n 80
          } >snap-diagnostics.log 2>&1 || true
          cat snap-diagnostics.log
          if [[ -s canary.json ]]; then cat canary.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-snap
          path: |
            canary.json
            snap-*.log
          if-no-files-found: ignore
