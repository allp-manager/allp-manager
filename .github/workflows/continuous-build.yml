name: Continuous Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: continuous-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.identity.outputs.base_version }}
      revision: ${{ steps.identity.outputs.revision }}
      display_version: ${{ steps.identity.outputs.display_version }}
      built_at: ${{ steps.identity.outputs.built_at }}
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          revision="${GITHUB_RUN_NUMBER}"
          display_version="${base_version}.${revision}"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          build_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          printf 'base_version=%s\n' "$base_version" >>"$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
          printf 'display_version=%s\n' "$display_version" >>"$GITHUB_OUTPUT"
          printf 'built_at=%s\n' "$built_at" >>"$GITHUB_OUTPUT"
          printf 'build_id=%s\n' "$build_id" >>"$GITHUB_OUTPUT"

  quality:
    needs: metadata
    runs-on: ubuntu-latest
    env: &build_identity
      ALLP_BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      ALLP_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
      ALLP_GIT_SHA: ${{ github.sha }}
      ALLP_BUILD_ID: ${{ needs.metadata.outputs.build_id }}
      ALLP_BUILD_TIMESTAMP: ${{ needs.metadata.outputs.built_at }}
      ALLP_BUILD_CHANNEL: continuous
      ALLP_BUILD_OFFICIAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: bash scripts/check-architecture.sh
      - run: bash scripts/test-continuous-manifest.sh
      - run: cargo build --release
      - name: Verify compiled identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(target/release/allp --version)" = "allp ${{ needs.metadata.outputs.display_version }}"
          target/release/allp --version --verbose | grep -F "${GITHUB_SHA}"
          target/release/allp --version --verbose | grep -F "${{ needs.metadata.outputs.build_id }}"

  binary:
    needs: [metadata, quality]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: allp
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: allp
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: allp
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: allp
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: allp.exe
    runs-on: ${{ matrix.os }}
    env: *build_identity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="allp-${{ needs.metadata.outputs.display_version }}-${{ matrix.target }}.tar.gz"
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/allp
          tar -C package -czf "dist/$name" allp
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name" >"$name.sha256")
          else
            hash="$(shasum -a 256 "dist/$name" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$name" >"dist/$name.sha256"
          fi
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "allp-${{ needs.metadata.outputs.display_version }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist, package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "package/allp.exe"
          Compress-Archive -Path "package/allp.exe" -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -NoNewline "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [metadata, binary]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: continuous-*
          path: dist
          merge-multiple: true
      - name: Verify assets and generate authoritative manifest
        id: continuous_manifest
        shell: bash
        run: |
          set -euo pipefail
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
          python3 scripts/generate-continuous-manifest.py \
            --base-version "${{ needs.metadata.outputs.base_version }}" \
            --build-revision "${{ needs.metadata.outputs.revision }}" \
            --git-commit "${GITHUB_SHA}" \
            --build-id "${{ needs.metadata.outputs.build_id }}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-number "${GITHUB_RUN_NUMBER}" \
            --built-at "${{ needs.metadata.outputs.built_at }}" \
            --minimum-updater-version 0.3.5 \
            --dist dist \
            --output dist/allp-continuous-manifest.json
          python3 scripts/generate-continuous-manifest.py \
            --verify dist/allp-continuous-manifest.json \
            --dist dist
          manifest_sha="$(sha256sum dist/allp-continuous-manifest.json | awk '{print $1}')"
          printf 'manifest_sha=%s\n' "$manifest_sha" >>"$GITHUB_OUTPUT"
      - name: Retain native GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: allp-continuous-${{ needs.metadata.outputs.display_version }}-${{ steps.continuous_manifest.outputs.manifest_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish anonymous-download mirror as a non-stable prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag="continuous-v${{ needs.metadata.outputs.display_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            trap 'rm -rf -- "$existing"' EXIT
            gh release download "$tag" \
              --pattern allp-continuous-manifest.json \
              --dir "$existing"
            python3 -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); assert str(m["workflow_run_id"]) == sys.argv[2], "continuous tag belongs to another workflow run"; assert m["git_commit"] == sys.argv[3], "continuous tag belongs to another commit"' \
              "$existing/allp-continuous-manifest.json" \
              "$GITHUB_RUN_ID" \
              "$GITHUB_SHA"
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --prerelease --title "Allp continuous ${{ needs.metadata.outputs.display_version }}"
          else
            gh release create "$tag" dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Allp continuous ${{ needs.metadata.outputs.display_version }}" \
              --notes "Automated verified continuous build. This is not a stable release."
          fi
